name: Reusable deploy
on: 
  workflow_call
    inputs:
      artifact-name:
        description:  The name of the artifact
        required: false
        default: dist
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v3
        with:
          name: ${{ inputs.artifact-name}}
      - nameL List files
        runs: ls
      - name: Output Information
        run: echo "Delpoying & uploading"